name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        # Wait until mongod actually accepts connections before running tests.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: npm }
      # The voice-note tests transcode and concatenate real audio. The hosted
      # runner used to ship ffmpeg and no longer does, so this fallback is the
      # path that actually runs.
      #
      # `apt-get update` first, always: the runner image's package lists go stale,
      # and apt then asks the mirror for a .deb version that has already been
      # superseded — which answers 404 and fails the whole job. libssh-gcrypt-4
      # did exactly that. --no-install-recommends because ffmpeg's recommends drag
      # in pocketsphinx and the VA-API/VDPAU drivers, ~30 MB the tests never touch
      # and thirty more packages that can 404.
      - name: Install ffmpeg
        run: |
          ffmpeg -version > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          }
      - run: npm ci
      - run: npm test
        env:
          API_MONGO_URI: mongodb://localhost:27017/tea-taste-test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: nikita8konkin/tea-taste-api:latest
      # No SSH restart step: the home server is not reachable from the
      # internet (ISP blocks inbound). Watchtower on the server polls
      # Docker Hub and restarts the container when :latest changes.